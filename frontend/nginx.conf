server {
    listen 80;
    server_name aggregatesummarizer.com www.aggregatesummarizer.com;

    return 301 https://$host$request_uri;
}

server{
    listen 443 ssl;
    http2 on;
    server_name aggregatesummarizer.com www.aggregatesummarizer.com;

    ssl_certificate /etc/letsencrypt/live/aggregatesummarizer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aggregatesummarizer.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
}